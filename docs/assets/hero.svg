<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t">
  <title id="t">A locked phone gallery releasing photos and videos to a laptop</title>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f5f5c"/><stop offset="1" stop-color="#0a3f3d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a6b"/><stop offset="1" stop-color="#f2b880"/>
    </linearGradient>
  </defs>
  <circle cx="330" cy="240" r="210" fill="#e8f1ef"/>
  <circle cx="330" cy="240" r="150" fill="#d7e8e4"/>
  <!-- flow path -->
  <path d="M230 170 C 320 80, 420 90, 470 200" fill="none" stroke="#0f5f5c" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- phone -->
  <g transform="rotate(-8 190 280)">
    <rect x="120" y="140" width="140" height="270" rx="22" fill="#1c2b2a"/>
    <rect x="130" y="156" width="120" height="238" rx="12" fill="url(#screen)"/>
    <rect x="172" y="146" width="36" height="5" rx="2.5" fill="#33504e"/>
    <g fill="#1a7a75">
      <rect x="142" y="300" width="30" height="30" rx="5"/><rect x="176" y="300" width="30" height="30" rx="5"/><rect x="210" y="300" width="30" height="30" rx="5"/>
      <rect x="142" y="334" width="30" height="30" rx="5"/><rect x="176" y="334" width="30" height="30" rx="5"/><rect x="210" y="334" width="30" height="30" rx="5"/>
    </g>
    <!-- padlock -->
    <path d="M172 232 v-22 a18 18 0 0 1 36 0 v6" fill="none" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>
    <rect x="160" y="230" width="60" height="48" rx="10" fill="url(#glow)"/>
    <circle cx="190" cy="250" r="6" fill="#0a3f3d"/><rect x="187" y="252" width="6" height="14" rx="3" fill="#0a3f3d"/>
  </g>
  <!-- floating photos -->
  <g transform="translate(268 108) rotate(-12)">
    <rect width="64" height="56" rx="6" fill="#fff" stroke="#c9dcd8" stroke-width="2"/>
    <rect x="6" y="6" width="52" height="34" rx="3" fill="#f2b880"/>
    <path d="M6 40 L24 22 L36 32 L44 26 L58 40 Z" fill="#0f5f5c"/><circle cx="46" cy="14" r="4" fill="#fff"/>
  </g>
  <g transform="translate(350 70) rotate(8)">
    <rect width="70" height="50" rx="6" fill="#fff" stroke="#c9dcd8" stroke-width="2"/>
    <rect x="6" y="6" width="58" height="38" rx="3" fill="#1a7a75"/>
    <path d="M29 16 L45 25 L29 34 Z" fill="#fff"/>
    <g fill="#e8f1ef"><rect x="9" y="8" width="4" height="4"/><rect x="9" y="38" width="4" height="4"/><rect x="57" y="8" width="4" height="4"/><rect x="57" y="38" width="4" height="4"/></g>
  </g>
  <g transform="translate(430 128) rotate(16)">
    <rect width="56" height="50" rx="6" fill="#fff" stroke="#c9dcd8" stroke-width="2"/>
    <rect x="6" y="6" width="44" height="30" rx="3" fill="#ff8a6b"/>
    <circle cx="28" cy="21" r="8" fill="#fff" opacity=".85"/>
  </g>
  <!-- laptop -->
  <rect x="380" y="230" width="190" height="124" rx="10" fill="#1c2b2a"/>
  <rect x="392" y="242" width="166" height="100" rx="4" fill="#fbf8f3"/>
  <g>
    <rect x="402" y="252" width="46" height="36" rx="3" fill="#f2b880"/>
    <rect x="452" y="252" width="46" height="36" rx="3" fill="#1a7a75"/>
    <rect x="502" y="252" width="46" height="36" rx="3" fill="#ff8a6b"/>
    <rect x="402" y="294" width="46" height="36" rx="3" fill="#1a7a75"/>
    <rect x="452" y="294" width="46" height="36" rx="3" fill="#ff8a6b"/>
    <rect x="502" y="294" width="46" height="36" rx="3" fill="#f2b880"/>
  </g>
  <path d="M360 354 h230 l-14 18 h-202 z" fill="#2c403e"/>
  <!-- check badge -->
  <circle cx="565" cy="228" r="22" fill="#0f5f5c"/>
  <path d="M554 228 l8 8 l14 -16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sparkles -->
  <g fill="#ff8a6b"><circle cx="300" cy="200" r="4"/><circle cx="420" cy="60" r="3"/><circle cx="520" cy="110" r="4"/></g>
</svg>
