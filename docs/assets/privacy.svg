<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">An offline laptop protected by a shield, with the cloud crossed out</title>
  <circle cx="240" cy="190" r="150" fill="#e8f1ef"/>
  <!-- crossed cloud -->
  <g transform="translate(300 40)">
    <path d="M20 60 a22 22 0 0 1 4 -44 a30 30 0 0 1 56 6 a20 20 0 0 1 4 38 z" fill="#fff" stroke="#9fc1bb" stroke-width="3"/>
    <path d="M10 76 L96 6" stroke="#ff8a6b" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- laptop -->
  <rect x="110" y="130" width="230" height="150" rx="12" fill="#1c2b2a"/>
  <rect x="124" y="144" width="202" height="122" rx="5" fill="#fbf8f3"/>
  <path d="M86 280 h278 l-16 22 h-246 z" fill="#2c403e"/>
  <!-- shield -->
  <path d="M225 160 l52 18 v34 c0 30 -22 48 -52 58 c-30 -10 -52 -28 -52 -58 v-34 z" fill="#0f5f5c"/>
  <path d="M206 214 l13 13 l26 -28" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f2b880"><circle cx="90" cy="110" r="5"/><circle cx="390" cy="200" r="6"/><circle cx="130" cy="60" r="3"/></g>
</svg>
