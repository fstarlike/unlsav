<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t">
  <title id="t">A phone with a broken padlock being watched by an eye</title>
  <defs>
    <radialGradient id="g" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".45"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#g)"/>
  <!-- eye watching -->
  <g transform="translate(232 58)">
    <path d="M-44 0 C -22 -30, 22 -30, 44 0 C 22 30, -22 30, -44 0 Z" fill="#2a0d0d" stroke="#fca5a5" stroke-width="3"/>
    <circle r="15" fill="#ef4444"/><circle r="6" fill="#1a0606"/><circle cx="5" cy="-5" r="3" fill="#fff"/>
  </g>
  <path d="M192 84 L 150 110" stroke="#fca5a5" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round"/>
  <!-- phone -->
  <g transform="rotate(-8 110 120)">
    <rect x="62" y="40" width="96" height="160" rx="16" fill="#1a0606" stroke="#7f1d1d" stroke-width="3"/>
    <rect x="70" y="52" width="80" height="136" rx="8" fill="#3b0f0f"/>
    <!-- broken padlock -->
    <path d="M94 108 v-14 a16 16 0 0 1 30 -6" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
    <path d="M86 106 h22 l-4 9 l6 7 l-5 22 h-19 a5 5 0 0 1 -5 -5 v-28 a5 5 0 0 1 5 -5z" fill="#fbbf24"/>
    <path d="M114 106 h20 a5 5 0 0 1 5 5 v28 a5 5 0 0 1 -5 5 h-17 l5 -20 l-6 -8z" fill="#f59e0b" transform="translate(4 3) rotate(6 126 125)"/>
    <g fill="#7f1d1d"><rect x="78" y="158" width="18" height="18" rx="3"/><rect x="101" y="158" width="18" height="18" rx="3"/><rect x="124" y="158" width="18" height="18" rx="3"/></g>
  </g>
  <!-- leaking photos -->
  <g transform="translate(176 120) rotate(14)">
    <rect width="40" height="34" rx="4" fill="#fff" opacity=".9"/><rect x="4" y="4" width="32" height="20" rx="2" fill="#fca5a5"/>
  </g>
  <g transform="translate(214 140) rotate(-8)">
    <rect width="40" height="34" rx="4" fill="#fff" opacity=".75"/><rect x="4" y="4" width="32" height="20" rx="2" fill="#ef4444"/>
  </g>
</svg>
